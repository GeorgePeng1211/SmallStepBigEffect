<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liner Demo QR</title><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#07070b;color:white;font-family:Inter,system-ui,sans-serif}main{width:min(92vw,430px);padding:24px;border:1px solid #ffffff20;border-radius:16px;background:#ffffff10;text-align:center}img{width:min(72vw,300px);height:min(72vw,300px);padding:12px;border-radius:12px;background:white}a{display:block;margin-top:18px;color:#20f4ee;overflow-wrap:anywhere;font-weight:800}</style></head><body><main><h1>Liner Mobile Demo</h1><p>扫码在手机端体验。</p><img id="qr" alt="QR"><a id="link"></a></main><script>const p=new URLSearchParams(location.search);const u=p.get('u')||`${location.origin}${location.pathname.replace('qr.html','index.html')}`;qr.src=`https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=12&data=${encodeURIComponent(u)}`;link.href=u;link.textContent=u;</script></body></html>
